<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bí Kíp Giao Diện Hiện Đại & Hiệu Ứng Hạt</title>

  <!-- Favicon & PWA Icons cho mọi thiết bị -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#007AFF">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      background: #0f0c29;
      color: #fff;
      transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1), color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- CANVAS HIỆU ỨNG HẠT VÀ BLOB --- */
    canvas#canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      will-change: transform;
    }

    .blob-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: #f0f2f5;
    }

    .blob {
      position: absolute;
      width: 400px;
      height: 400px;
      filter: blur(80px);
      border-radius: 50%;
      opacity: 0.4;
      animation: move 15s infinite alternate;
      will-change: transform;
    }
    .blob-1 { top: -100px; left: -100px; background: #ff3b30; }
    .blob-2 { bottom: -100px; right: -100px; background: #5856d6; }
    .blob-3 { top: 40%; left: 30%; background: #34c759; width: 250px; }

    @keyframes move {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(60px, 80px) scale(1.1); }
    }

    /* --- BIẾN SỐ TOÀN CỤC --- */
    :root {
      --glass-bg: rgba(255, 255, 255, 0.7);
      --text-main: #1d1d1f;
      --accent-color: #007AFF;
      --blur-val: 15px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .icon {
      width: 1em;
      height: 1em;
      display: inline-block;
      vertical-align: -0.125em;
      fill: currentColor;
    }
    .acc-header .icon {
      width: 0.9em;
      height: 0.9em;
    }

    /* --- KHU VỰC CHÀO MỪNG & ĐỒNG HỒ --- */
    .dashboard {
      text-align: center;
      z-index: 2;
      padding: 20px;
      pointer-events: none;
    }

    #greeting {
      font-size: 2.8rem;
      margin: 0;
      font-weight: 700;
    }
    #time-detail {
      font-size: 1.1rem;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    #digital-clock {
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--accent-color);
      text-shadow: 0 0 25px rgba(0, 122, 255, 0.5);
      font-family: 'Courier New', monospace;
    }
    #date-display {
      font-size: 1rem;
      letter-spacing: 3px;
      opacity: 0.8;
    }

    /* --- NÚT MENU VÀ LỚP PHỦ --- */
    #menuBtn {
      position: fixed;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: white;
      color: var(--text-main);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 1001;
      font-size: 24px;
      transition: 0.2s;
      pointer-events: auto;
    }
    #menuBtn:active { transform: scale(0.9); }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      z-index: 999;
    }

    /* --- MENU ACCORDION --- */
    .menu {
      position: fixed;
      width: 300px;
      max-width: calc(100vw - 40px);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-val));
      -webkit-backdrop-filter: blur(var(--blur-val));
      border-radius: 25px;
      padding: 20px;
      display: none;
      z-index: 1000;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.3);
      color: var(--text-main);
      pointer-events: auto;
    }
    .menu.show {
      display: block;
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .acc-item {
      margin-bottom: 10px;
      border-radius: 15px;
      background: rgba(255,255,255,0.2);
    }
    .acc-header {
      padding: 15px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
    }
    .acc-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
      display: flex;
      flex-direction: column;
      padding: 0 15px;
    }
    .acc-item.active .acc-content {
      max-height: 200px;
      padding-bottom: 15px;
    }
    .acc-item.active .acc-header { color: var(--accent-color); }

    .acc-content button, .acc-content a {
      background: rgba(255,255,255,0.4);
      border: none;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      color: inherit;
      text-decoration: none;
    }

    /* --- VỊ TRÍ & THEME --- */
    .top-left { top: 20px; left: 20px; }
    .top-right { top: 20px; right: 20px; }
    .bottom-left { bottom: 20px; left: 20px; }
    .bottom-right { bottom: 20px; right: 20px; }

    body[data-theme="light"] {
      color: #1d1d1f;
    }
    body[data-theme="light"] .blob-container { display: block; }

    body[data-theme="dark"] {
      background: #0f0c29;
      color: #fff;
      --glass-bg: rgba(30, 30, 30, 0.8);
      --text-main: #fff;
    }
    body[data-theme="dark"] .blob-container { display: none; }
    body[data-theme="dark"] #menuBtn {
      background: #333;
      color: #fff;
    }

    @media (max-width: 480px) {
      #digital-clock { font-size: 3rem; }
      .menu {
        width: 90%;
        left: 5% !important;
        bottom: 90px !important;
        top: auto !important;
      }
    }
  </style>
</head>
<body data-theme="dark">

  <div class="blob-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="overlay" onclick="closeMenu()"></div>

  <button id="menuBtn" class="bottom-left" onclick="toggleMenu()">
    <svg class="icon" viewBox="0 0 512 512" fill="currentColor">
      <circle cx="96" cy="96" r="48"/><circle cx="256" cy="96" r="48"/><circle cx="416" cy="96" r="48"/>
      <circle cx="96" cy="256" r="48"/><circle cx="256" cy="256" r="48"/><circle cx="416" cy="256" r="48"/>
      <circle cx="96" cy="416" r="48"/><circle cx="256" cy="416" r="48"/><circle cx="416" cy="416" r="48"/>
    </svg>
  </button>

  <div id="menu" class="menu top-left">
    <div class="acc-item">
      <div class="acc-header" onclick="toggleAcc(this)">
        <span><svg class="icon" viewBox="0 0 576 512"><path d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 2.7-.2 5.4-.5 8.1V472c0 22.1-17.9 40-40 40H456c-1.1 0-2.2 0-3.3-.1c-1.4 .1-2.8 .1-4.2 .1H416 392c-22.1 0-40-17.9-40-40V448 384c0-17.7-14.3-32-32-32H256c-17.7 0-32 14.3-32 32v64 24c0 22.1-17.9 40-40 40H160 128.1c-1.5 0-3-.1-4.5-.2c-1.2 .1-2.4 .2-3.6 .2H104c-22.1 0-40-17.9-40-40V360c0-.9 0-1.9 .1-2.8V287.6H32c-18 0-32-14-32-32.1c0-9 3-17 10-24L266.4 8c7-7 15-8 22-8s15 1 21 7L564.8 231.5c8 7 12 15 11 24z" /></svg> TRANG CHỦ</span>
        <svg class="icon" viewBox="0 0 512 512"><path d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z" /></svg>
      </div>
      <div class="acc-content">
        <a href="#">Bảng tin</a>
        <a href="#">Thông báo</a>
      </div>
    </div>

    <div class="acc-item">
      <div class="acc-header" onclick="toggleAcc(this)">
        <span><svg class="icon" viewBox="0 0 512 512" fill="currentColor"><path d="M256 32L32 144l224 112 192-96v128h32V144L256 32zM416 260.6l-160 80-160-80v83.4l160 80 160-80v-83.4z" /></svg> HỌC CODE</span>
        <svg class="icon" viewBox="0 0 512 512"><path d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z" /></svg>
      </div>
      <div class="acc-content">     
        <a href="#">HTML CSS JAVASCRIPT</a>
        <a href="#">PWA TOOL</a>
        <div class="acc-content1">
        <a href="./assets/monaco/index.html">Genesis Monaco Editor</a>
        <a href="./assets/Zyntax/index.html">Genesis Zyntax Editor</a>
      </div>
    </div>

    <div class="acc-item">
      <div class="acc-header" onclick="toggleAcc(this)">
        <span><svg class="icon" viewBox="0 0 24 24"><path d="M12 2l-4 4h3v5H6V8l-4 4 4 4v-3h5v5H8l4 4 4-4h-3v-5h5v3l4-4-4-4v3h-5V6h3z" /></svg> VỊ TRÍ MENU</span>
        <svg class="icon" viewBox="0 0 512 512"><path d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z" /></svg>
      </div>
      <div class="acc-content">
        <button onclick="setPos('top-left')">Trên trái</button>
        <button onclick="setPos('top-right')">Trên phải</button>
        <button onclick="setPos('bottom-left')">Dưới trái</button>
        <button onclick="setPos('bottom-right')">Dưới phải</button>
      </div>
    </div>

    <div class="acc-item">
      <div class="acc-header" onclick="toggleAcc(this)">
        <span><svg class="icon" viewBox="0 0 384 512"><path d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z" /></svg> GIAO DIỆN</span>
        <svg class="icon" viewBox="0 0 512 512"><path d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z" /></svg>
      </div>
      <div class="acc-content">
        <button onclick="setTheme('light')">Chế độ Sáng</button>
        <button onclick="setTheme('dark')">Chế độ Tối</button>
        <button onclick="setTheme('auto')">Tự động (Theo máy)</button>
      </div>
    </div>
  </div>

  <div class="dashboard">
    <h1 id="greeting">Xin chào!</h1>
    <p id="time-detail">Đang cập nhật thời gian...</p>
    <div id="digital-clock">00:00:00</div>
    <div id="date-display">Đang tải ngày tháng...</div>
  </div>

  <script>
    // Đăng ký Service Worker cho PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker đăng ký thành công!', reg))
          .catch(err => console.log('Đăng ký Service Worker thất bại:', err));
      });
    }

    const menu = document.getElementById('menu');
    const overlay = document.getElementById('overlay');
    const menuBtn = document.getElementById('menuBtn');
    let currentThemeMode = 'dark';

    function haptic(ms = 15) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function toggleMenu() {
      haptic(20);
      const isShow = menu.classList.toggle('show');
      overlay.style.display = isShow ? 'block': 'none';
    }

    function closeMenu() {
      haptic(20);
      menu.classList.remove('show');
      overlay.style.display = 'none';
      document.querySelectorAll('.acc-item').forEach(item => item.classList.remove('active'));
    }

    function toggleAcc(header) {
      haptic(10);
      const currentItem = header.parentElement;
      const allItems = document.querySelectorAll('.acc-item');

      allItems.forEach(item => {
        if (item !== currentItem) item.classList.remove('active');
      });
      currentItem.classList.toggle('active');
    }

    function updateGreeting() {
      const hrs = new Date().getHours();
      const g = document.getElementById('greeting');
      const d = document.getElementById('time-detail');

      if (hrs < 12) {
        g.innerText = "☀️ Chào Buổi Sáng!"; d.innerText = "Chúc học trò ngày mới đầy năng lượng!";
      } else if (hrs < 18) {
        g.innerText = "🌤️ Chào Buổi Chiều!"; d.innerText = "Học tập hăng say, đừng quên nghỉ ngơi nhé!";
      } else {
        g.innerText = "🌙 Chào Buổi Tối!"; d.innerText = "Muộn rồi, hãy thư giãn một chút học trò ơi!";
      }
    }

    function startClock() {
      const clock = document.getElementById('digital-clock');
      const dateBox = document.getElementById('date-display');
      const days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];

      setInterval(() => {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');

        clock.innerText = `${h}:${m}:${s}`;
        dateBox.innerText = `${days[now.getDay()]}, ${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}`;
      }, 1000);
    }

    function setPos(p) {
      haptic(15);
      menuBtn.className = p;
      menu.className = "menu show " + p;
      localStorage.setItem('menuPos', p);
    }

    function resolveTheme(pref) {
      if (pref === 'auto') {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark': 'light';
      }
      return pref;
    }

    function applyTheme(pref) {
      currentThemeMode = resolveTheme(pref);
      document.body.setAttribute('data-theme', currentThemeMode);
    }

    function setTheme(t) {
      haptic([10, 30, 10]);
      localStorage.setItem('menuTheme', t);
      applyTheme(t);
      toggleMenu();
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      const pref = localStorage.getItem('menuTheme') || 'auto';
      if (pref === 'auto') applyTheme('auto');
    });

    /* --- HIỆU ỨNG HẠT CANVAS SIÊU MƯỢT --- */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let mouseX = 0, mouseY = 0;
    let isInteracting = false;
    const particles = [];
    const colors = ['#ff5e93', '#ff61ef', '#cc5bff', '#7a68fe', '#4cc9f0', '#5effc9', '#ffa55e'];

    class Particle {
      constructor(x, y, speedX, speedY, size, color) {
        this.x = x; this.y = y;
        this.speedX = speedX; this.speedY = speedY;
        this.size = size; this.color = color;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.008;
        this.angle = 0;
        this.angleSpeed = Math.random() * 0.1 - 0.05;
      }

      update() {
        this.angle += this.angleSpeed;
        this.x += this.speedX + Math.cos(this.angle) * 1.5;
        this.y += this.speedY + Math.sin(this.angle) * 1.5;
        this.speedX *= 0.98;
        this.speedY *= 0.98;
        this.alpha -= this.decay;
        this.size *= 0.987;
      }

      draw() {
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function createParticles(x, y, speedX, speedY) {
      const count = Math.floor(Math.random() * 4) + 3;
      const color = colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        const size = Math.random() * 8 + 3;

        const particleSpeedX = (Math.cos(angle) * speed) + (speedX * 0.4);
        const particleSpeedY = (Math.sin(angle) * speed) + (speedY * 0.4);

        particles.push(new Particle(x, y, particleSpeedX, particleSpeedY, size, color));
      }
    }

    function drawConnections() {
      const len = particles.length;
      for (let i = 0; i < len; i++) {
        for (let j = i + 1; j < len; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 90) {
            const alpha = Math.min(1 - distance/90, particles[i].alpha, particles[j].alpha) * 0.35;
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.fillStyle = (currentThemeMode === 'dark') ? 'rgba(15, 12, 41, 0.25)' : 'rgba(240, 242, 245, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
          i--;
        }
      }

      drawConnections();

      if (isInteracting) {
        const gradient = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 120);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.fillStyle = gradient;
        ctx.fillRect(mouseX - 120, mouseY - 120, 240, 240);
      }

      requestAnimationFrame(animate);
    }

    let lastX = 0, lastY = 0;

    function handleStart(x, y) {
      mouseX = x; mouseY = y;
      lastX = x; lastY = y;
      isInteracting = true;
    }

    function handleMove(x, y) {
      mouseX = x; mouseY = y;
      const speedX = x - lastX;
      const speedY = y - lastY;
      createParticles(x, y, speedX, speedY);
      lastX = x; lastY = y;
    }

    function handleEnd() {
      isInteracting = false;
    }

    window.addEventListener('mousedown', (e) => handleStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => { if (isInteracting) handleMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', handleEnd);

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) handleStart(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchend', handleEnd);

    window.onload = () => {
      updateGreeting();
      startClock();
      const p = localStorage.getItem('menuPos');
      const t = localStorage.getItem('menuTheme') || 'auto';
      if (p) {
        menuBtn.className = p; 
        menu.className = "menu " + p;
      }
      applyTheme(t);
      animate();
    };
  </script>
</body>
</html>
